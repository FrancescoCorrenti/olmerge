[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "olmerge"
version = "0.1.0"
description = "Two-way git merge between a local repository and an Overleaf project, on any Overleaf plan"
readme = "README.md"
license = "MIT"
authors = [{ name = "Francesco Correnti" }]
requires-python = ">=3.9"
dependencies = ["pyoverleaf==0.1.8", "keyring>=24", "beautifulsoup4>=4"]
keywords = ["overleaf", "latex", "git", "sync", "merge"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Text Processing :: Markup :: LaTeX", "Environment :: Console"]

[project.urls]
Homepage = "https://github.com/FrancescoCorrenti/olmerge"

[project.scripts]
olmerge = "olmerge:main"

[tool.setuptools]
py-modules = ["olmerge"]
